<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto-Clipper</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="mark">
        <svg viewBox="0 0 40 24" class="mark-svg"><polyline points="0,14 6,14 9,4 13,20 17,10 20,14 40,14" /></svg>
      </div>
      <h1>Auto-Clipper</h1>
      <p class="sub">Paste a VOD link. It finds the loud, fast, high-intensity moments and cuts them.</p>
    </header>

    <section class="panel" id="input-panel">
      <div class="field-row">
        <input id="url" type="text" placeholder="https://www.twitch.tv/videos/..." autocomplete="off">
        <button id="start-btn">Find clips</button>
      </div>
      {% if needs_key %}
      <div class="field-row" style="margin-top:10px;">
        <input id="access-key" type="password" placeholder="Access key" autocomplete="off">
      </div>
      {% endif %}

      <details class="settings">
        <summary>Settings</summary>
        <div class="settings-grid">
          <label>
            Audio vs. motion weight
            <input id="audio-weight" type="range" min="0" max="1" step="0.1" value="0.6">
            <span class="hint" id="weight-hint">60% audio / 40% motion</span>
          </label>
          <label>
            Clip length (sec)
            <input id="clip-length" type="number" min="10" max="90" value="30">
          </label>
          <label>
            Max clips
            <input id="max-clips" type="number" min="1" max="40" value="15">
          </label>
          <label>
            Target resolution
            <select id="target-height">
              <option value="2160">Up to 4K (source max)</option>
              <option value="1440">Up to 2K/1440p</option>
              <option value="1080" selected>1080p</option>
            </select>
          </label>
        </div>
      </details>
    </section>

    <section class="panel hidden" id="progress-panel">
      <div class="stage-line">
        <span id="stage-label">Queued</span>
        <span id="pct-label">0%</span>
      </div>
      <div class="pulse-track">
        <svg viewBox="0 0 400 40" preserveAspectRatio="none" class="pulse-svg">
          <polyline id="pulse-line" points="" />
        </svg>
        <div class="pulse-fill" id="pulse-fill"></div>
      </div>
      <p class="error hidden" id="error-msg"></p>
    </section>

    <section class="panel hidden" id="results-panel">
      <h2 id="results-title">Clips</h2>
      <div class="grid" id="results-grid"></div>
    </section>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
